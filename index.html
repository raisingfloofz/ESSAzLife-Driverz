<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#58cc02"><title>ESSAzLife: Driverz</title><link rel="icon" href="./icon"><style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap');
:root{--accent:#58cc02;--pale:#e4f8d8;--ink:#4b4b4b;--muted:#777;--bg:#fff;--panel:#fff;--line:#e5e5e5;--blue:#1cb0f6}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,sans-serif;font-weight:800}button,select{font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.55}.shell{max-width:760px;margin:auto;min-height:100dvh;padding:0 16px 95px}.top{position:sticky;top:0;z-index:4;display:flex;align-items:center;justify-content:space-between;background:var(--bg);border-bottom:2px solid var(--line);padding:12px 0;gap:8px}.brand{display:flex;align-items:center;gap:10px;min-width:0}.brand img{width:49px;height:49px;object-fit:contain;border-radius:12px}.brand .name{font-size:22px;font-weight:900;line-height:1.05}.sub{font-size:12px;color:var(--muted);font-weight:700}.top-actions{display:flex;align-items:center;gap:6px}.tiny{background:transparent;border:0;padding:8px;color:var(--ink);font-size:22px}.pill{background:var(--pale);color:var(--accent);padding:5px 10px;border-radius:20px;font-size:13px;white-space:nowrap}.hero{background:var(--accent);color:white;border-radius:18px;padding:20px;margin:20px 0}.hero h1{margin:5px 0;font-size:26px;line-height:1.1}.hero p{margin:6px 0 0}.card{border:2px solid var(--line);border-radius:17px;padding:18px;background:var(--panel);margin:14px 0}.card h2{margin:0 0 9px;font-size:21px}.card p{margin:6px 0 12px}.muted{color:var(--muted)}.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:2px solid var(--accent);border-bottom-width:4px;border-radius:12px;background:var(--accent);color:white;padding:12px 18px;min-height:48px;text-align:center;font-size:15px;font-weight:900}.btn.secondary{background:var(--panel);color:var(--accent)}.btn.neutral{background:var(--panel);color:var(--ink);border-color:var(--line)}.btn:active{transform:translateY(2px);border-bottom-width:2px}.wide{width:100%}.stack{display:grid;gap:10px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(115px,1fr));gap:10px}.choice{border:2px solid var(--line);background:var(--panel);border-bottom-width:4px;border-radius:14px;padding:12px;color:var(--ink);font-weight:900;min-height:58px}.choice.selected{border-color:var(--accent);background:var(--pale)}.choice:focus-visible,.btn:focus-visible,.tiny:focus-visible{outline:3px solid var(--blue);outline-offset:2px}.buddy{display:flex;align-items:center;gap:12px}.buddy img{width:74px;height:74px;object-fit:contain}.buddy .bubble{flex:1;border:2px solid var(--line);padding:12px;border-radius:15px;background:var(--panel);font-size:15px}.avatar{display:flex;flex-direction:column;align-items:center;gap:4px}.avatar img{width:75px;height:75px;object-fit:contain}.avatar span{font-size:13px}.progress{height:15px;border-radius:20px;background:var(--line);overflow:hidden}.progress>div{height:100%;background:var(--accent);transition:width .2s}.path{display:flex;flex-direction:column;align-items:center;gap:12px;padding:12px 0 26px}.node{width:76px;height:76px;border:3px solid var(--accent);border-bottom-width:7px;border-radius:50%;background:var(--accent);color:white;font-size:30px}.node.locked{border-color:var(--line);background:#bbb}.node.done{background:var(--pale);color:var(--accent)}.path-item{display:flex;flex-direction:column;align-items:center;gap:4px;position:relative}.path-item:nth-child(3n+2){transform:translateX(55px)}.path-item:nth-child(3n){transform:translateX(-55px)}.path-label{font-size:12px;max-width:170px;text-align:center}.nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;background:var(--bg);border-top:2px solid var(--line);z-index:5;padding:7px max(10px,env(safe-area-inset-right)) calc(7px + env(safe-area-inset-bottom))}.nav-inner{max-width:760px;width:100%;display:flex;justify-content:space-around}.nav button{border:0;background:transparent;color:var(--muted);font-size:12px;font-weight:900;min-width:65px;padding:4px}.nav button.active{color:var(--accent)}.nav .symbol{font-size:24px;display:block}.question{font-size:23px;line-height:1.25;margin:18px 0}.feedback{padding:14px;border-radius:12px;margin:12px 0;background:var(--pale)}.feedback.bad{background:#ffe5e5;color:#8c3333}.eyebrow{font-size:12px;letter-spacing:1px;color:var(--muted);text-transform:uppercase}.lesson-info{font-size:18px;line-height:1.55}.lesson-info strong{color:var(--accent)}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.swatch{height:26px;width:26px;border-radius:50%;display:inline-block;border:2px solid #ddd;vertical-align:middle;margin-right:8px}select{padding:12px;border-radius:12px;border:2px solid var(--line);background:var(--panel);color:var(--ink);width:100%}.notice{border-left:4px solid var(--blue);padding:10px 12px;background:var(--pale);border-radius:8px;font-size:13px}.hidden{display:none!important}a{color:var(--accent)}@media(min-width:600px){.shell{padding-left:30px;padding-right:30px}.hero{padding:26px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><div class="shell"><header class="top"><div class="brand"><img src="./icon" alt="Driverz app icon" onerror="this.style.display='none'"><div><div class="name">Driverz</div><div class="sub" id="stateLabel">Your Driving School</div></div></div><div class="top-actions"><span class="pill" id="xpLabel">⭐ 0 XP</span><button class="tiny" id="settingsBtn" aria-label="Settings">⚙</button></div></header><main id="app" aria-live="polite"></main></div><nav class="nav hidden" id="nav"><div class="nav-inner"><button data-tab="learn"><span class="symbol">⌂</span>Learn</button><button data-tab="review"><span class="symbol">▤</span>Review</button><button data-tab="awards"><span class="symbol">★</span>Awards</button><button data-tab="profile"><span class="symbol">◉</span>Profile</button></div></nav><script>
'use strict';
const CHARACTERS=['boba','brisket','coco','coolant','crash','lily','maple','mocha','moose','mudpie','oreo','sprinkles','stormy','trouble'];
const STATES='Alabama|Alaska|Arizona|Arkansas|California|Colorado|Connecticut|Delaware|Florida|Georgia|Hawaii|Idaho|Illinois|Indiana|Iowa|Kansas|Kentucky|Louisiana|Maine|Maryland|Massachusetts|Michigan|Minnesota|Mississippi|Missouri|Montana|Nebraska|Nevada|New Hampshire|New Jersey|New Mexico|New York|North Carolina|North Dakota|Ohio|Oklahoma|Oregon|Pennsylvania|Rhode Island|South Carolina|South Dakota|Tennessee|Texas|Utah|Vermont|Virginia|Washington|West Virginia|Wisconsin|Wyoming'.split('|');
const THEMES={green:['#58cc02','#e4f8d8'],pink:['#ef69a8','#ffe5f0'],blue:['#1cb0f6','#def4ff'],purple:['#9c70e8','#eee3ff'],orange:['#f49a28','#fff0d9'],dark:['#79c83d','#263728']};
const SOUND={correct:'correct.wav',incorrect:'incorrect.wav',click:'click.wav',complete:'complete.wav',unlock:'unlock.mp3',levelup:'levelup.wav',achievement:'achievement.wav',streak:'streak.wav'};
const LESSONS=[
 {unit:'Meet Your Car',title:'NO NO & GO GO',teacher:'mudpie',info:['In most automatic cars, the <strong>brake</strong> is the wider pedal on the LEFT. We call it <strong>NO NO</strong> because it slows or stops the car.','The <strong>accelerator (gas pedal)</strong> is on the RIGHT. We call it <strong>GO GO</strong> because it makes the car go faster.','In an automatic car, use your <strong>RIGHT FOOT</strong> for both the brake and accelerator. Keep your left foot on the footrest.'],q:[['Which pedal is NO NO?',['Brake','Accelerator','Parking brake'],0,'NO NO means brake. It slows or stops the car.'],['Which pedal is GO GO?',['Brake','Accelerator','Clutch'],1,'GO GO means accelerator (gas pedal).'],['Which foot should operate both pedals in an automatic car?',['Left foot','Right foot','Both feet'],1,'Use your right foot for both pedals in an automatic car.']]},
 {unit:'Meet Your Car',title:'The Steering Wheel',teacher:'stormy',info:['The <strong>steering wheel</strong> controls the direction of the front wheels.','Use smooth, controlled steering movements and keep both hands ready to steer.','Look toward where you want the vehicle to go, while continually scanning the road.'],q:[['What controls the direction of the car?',['Steering wheel','Gas pedal','Turn signal'],0,'The steering wheel turns the vehicle.'],['How should you steer?',['With sudden jerks','Smoothly and deliberately','Only with one finger'],1,'Smooth steering gives you better control.']]},
 {unit:'Meet Your Car',title:'Mirrors & Blind Spots',teacher:'lily',info:['The <strong>rearview mirror</strong> shows traffic behind your vehicle. Side mirrors show areas to either side and behind.','<strong>Blind spots</strong> are areas that your mirrors may not show. Check over your shoulder when appropriate before changing lanes.','Adjust your mirrors before moving, not while distracted in traffic.'],q:[['Can mirrors show every area around your car?',['Yes','No'],1,'Mirrors leave blind spots.'],['When should you adjust mirrors?',['Before driving','In the middle of a turn'],0,'Set mirrors before you move.']]},
 {unit:'Meet Your Car',title:'Automatic Gears',teacher:'boba',info:['Most automatic gear selectors include <strong>P</strong> (Park), <strong>R</strong> (Reverse), <strong>N</strong> (Neutral), and <strong>D</strong> (Drive).','<strong>Park</strong> helps hold the vehicle while parked; <strong>Reverse</strong> moves backward; <strong>Drive</strong> is for normal forward travel.','Keep the brake pressed while selecting a gear, following the vehicle owner’s manual.'],q:[['Which letter means Reverse?',['P','R','D'],1,'R stands for Reverse.'],['Which letter is used for normal forward driving?',['N','D','P'],1,'D stands for Drive.']]},
 {unit:'Meet Your Car',title:'Dashboard Basics',teacher:'coolant',info:['The <strong>speedometer</strong> shows how fast the vehicle is traveling.','The <strong>fuel gauge</strong> shows how much fuel is in the tank. Electric vehicles have battery-charge displays.','Warning lights may indicate problems. Learn their meanings from your vehicle owner’s manual; never ignore a critical warning.'],q:[['What does a speedometer show?',['Speed','Fuel level','Engine temperature only'],0,'The speedometer displays vehicle speed.'],['Where can you find the meaning of a dashboard warning?',['Vehicle owner’s manual','Guessing from its color'],0,'Consult the owner’s manual.']]},
 {unit:'Meet Your Car',title:'Lights, Signals & Wipers',teacher:'sprinkles',info:['<strong>Turn signals</strong> communicate your intention to turn or change lanes. They do not give you the right-of-way.','<strong>Headlights</strong> help you see and be seen; use them as required by your state’s laws and conditions.','<strong>Windshield wipers</strong> clear rain and moisture from the windshield.'],q:[['Does signaling automatically give you the right-of-way?',['Yes','No'],1,'You still must check that the maneuver is safe.'],['What clears rain from the windshield?',['Wipers','Horn','Parking brake'],0,'Windshield wipers help maintain visibility.']]},
 {unit:'Meet Your Car',title:'Seats & Seat Belts',teacher:'maple',info:['Adjust the seat so you can comfortably reach the pedals and steering wheel while maintaining control.','Wear your <strong>seat belt</strong> correctly before moving. All occupants should be properly restrained.','Adjust head restraints and mirrors before driving.'],q:[['When should you fasten your seat belt?',['Before driving','Only on highways'],0,'Buckle up before moving.'],['What should you check before starting?',['Seat position','Phone notifications'],0,'Set up a safe driving position.']]},
 {unit:'Meet Your Car',title:'Parking Brake',teacher:'brisket',info:['The <strong>parking brake</strong> helps prevent a parked vehicle from rolling.','Use the parking brake as directed by your vehicle’s manual, especially when parking.','Check that it is released before driving, unless the vehicle releases it automatically.'],q:[['What is the parking brake for?',['Keeping a parked car from rolling','Making turns faster'],0,'It helps secure a parked vehicle.']]},
 {unit:'Meet Your Car',title:'Starting & Shutting Off',teacher:'mocha',info:['Before starting, check your surroundings, adjust your seat and mirrors, buckle up, and press the brake as required.','For many automatic cars, start the engine with the gear selector in <strong>Park</strong> and your foot on the brake.','When parking, come to a full stop, secure the vehicle with Park and the parking brake as directed, and switch it off. Vehicle procedures vary.'],q:[['Before moving, what should you do?',['Buckle up and check surroundings','Accelerate immediately'],0,'Prepare yourself and check the area around the car.'],['Do all vehicles have identical starting procedures?',['Yes','No'],1,'Follow the owner’s manual for your vehicle.']]},
 {unit:'Meet Your Car',title:'Unit 1 Checkpoint',teacher:'trouble',info:['You’ve met the major controls of an automatic car! Let’s check your understanding.','This is a learning checkpoint, not a state DMV exam.'],q:[['Which pedal slows or stops the car?',['Accelerator','Brake','Wiper'],1,'The brake is NO NO.'],['What does D mean on an automatic gear selector?',['Drive','Downhill','Door'],0,'D means Drive.'],['Should you check blind spots before changing lanes?',['Yes','No'],0,'Check mirrors and blind spots before moving over.'],['What is the speedometer for?',['Showing speed','Showing fuel'],0,'It shows your speed.'],['When do you fasten your seat belt?',['Before driving','After arriving'],0,'Buckle up before moving.']]}
];
const KEY='essazlife-driverz-v1';const defaults={state:'Pennsylvania',buddy:'moose',theme:'green',sound:true,setup:false,unlocked:0,completed:[],xp:0,streak:0,lastStudy:'',awards:[]};let data=load(),screen=data.setup?'learn':'welcome',lessonIndex=0,step=0,questionIndex=0,selected=-1,answered=false,mistakes=0;const app=document.getElementById('app');
function load(){try{const x=JSON.parse(localStorage.getItem(KEY));if(x&&typeof x==='object')return {...defaults,...x,completed:Array.isArray(x.completed)?x.completed:[],awards:Array.isArray(x.awards)?x.awards:[]}}catch(e){}return {...defaults}}function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){console.warn('Progress could not be saved',e)}}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function play(k){if(!data.sound)return;try{const a=new Audio('./'+SOUND[k]);a.volume=.55;a.play().catch(()=>{})}catch(e){}}function setTheme(){const t=THEMES[data.theme]||THEMES.green;document.documentElement.style.setProperty('--accent',t[0]);document.documentElement.style.setProperty('--pale',t[1]);const dark=data.theme==='dark';document.documentElement.style.setProperty('--bg',dark?'#151d19':'#fff');document.documentElement.style.setProperty('--panel',dark?'#1d2922':'#fff');document.documentElement.style.setProperty('--ink',dark?'#f4f4f4':'#4b4b4b');document.documentElement.style.setProperty('--muted',dark?'#b4c1b7':'#777');document.documentElement.style.setProperty('--line',dark?'#354339':'#e5e5e5');document.querySelector('meta[name="theme-color"]').content=t[0]}
function img(name){return `<img src="./${esc(name)}.png" alt="${esc(name)}" loading="lazy" onerror="this.style.opacity='.15'">`}function bubble(name,text){return `<div class="buddy">${img(name)}<div class="bubble"><b>${esc(name[0].toUpperCase()+name.slice(1))}:</b> ${text}</div></div>`}function button(label,action,kind=''){return `<button class="btn ${kind}" data-action="${action}">${label}</button>`}function render(){setTheme();document.getElementById('xpLabel').textContent='⭐ '+data.xp+' XP';document.getElementById('stateLabel').textContent=data.setup?data.state+' Driving School':'Your Driving School';document.getElementById('nav').classList.toggle('hidden',!data.setup||['welcome','onboard','lesson'].includes(screen));document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===screen));document.getElementById('settingsBtn').style.display=data.setup?'':'none';const views={welcome,onboard,learn,review,awards,profile,settings,lesson};app.innerHTML=(views[screen]||learn)()}
function welcome(){return `<section class="hero"><div class="eyebrow" style="color:white">ESSAzLife presents</div><h1>Welcome to Driverz! 🚗</h1><p>Learn to drive, one little lesson at a time.</p></section><div class="card"><h2>Start from the very beginning</h2><p>Meet the controls, practice road safety, and build confidence with your very own ESSA Buddy.</p>${button('LET’S GET STARTED','onboard','wide')}</div><div class="notice">Driverz is an educational study aid, not a replacement for official driver manuals, professional instruction, or supervised driving.</div>`}
function onboard(){return `<section class="hero"><h1>Build your driving school</h1><p>Pick your state, your Buddy, and your favorite color!</p></section><div class="card"><h2>1. Your state</h2><select id="stateSelect" aria-label="Select state">${STATES.map(s=>`<option ${data.state===s?'selected':''}>${s}</option>`).join('')}</select><p class="muted" style="font-size:13px">The first release contains foundational vehicle lessons. State-specific legal courses are not yet available and will be added only after official-source review.</p></div><div class="card"><h2>2. Choose your ESSA Buddy</h2><p>Your Buddy gives you unlimited hints. Everyone else becomes a teacher!</p><div class="grid">${CHARACTERS.map(c=>`<button class="choice avatar ${data.buddy===c?'selected':''}" data-buddy="${c}">${img(c)}<span>${esc(c)}</span></button>`).join('')}</div></div><div class="card"><h2>3. Choose your theme</h2>${themeChoices()}</div>${button('OPEN MY DRIVING SCHOOL','finishSetup','wide')}`}
function themeChoices(){return `<div class="grid">${Object.entries(THEMES).map(([name,colors])=>`<button class="choice ${data.theme===name?'selected':''}" data-theme="${name}"><span class="swatch" style="background:${colors[0]}"></span>${name[0].toUpperCase()+name.slice(1)}</button>`).join('')}</div>`}
function learn(){let finished=data.completed.length;return `<section class="hero"><div class="eyebrow" style="color:white">UNIT 1 · BEGINNER</div><h1>Meet Your Car!</h1><p>Learn what everything does before you hit the road.</p><div class="progress" style="background:#ffffff66;margin-top:14px"><div style="width:${finished/LESSONS.length*100}%;background:white"></div></div><small>${finished} of ${LESSONS.length} lessons completed</small></section>${bubble(data.buddy,finished===LESSONS.length?'You finished Unit 1! 🎉 Review anything you like.':'We’ll take this one step at a time. You’ve got this! 💚')}<div class="path">${LESSONS.map((l,i)=>`<div class="path-item"><button class="node ${data.completed.includes(i)?'done':''} ${i>data.unlocked?'locked':''}" data-lesson="${i}" ${i>data.unlocked?'disabled':''} aria-label="${esc(l.title)}">${i>data.unlocked?'🔒':data.completed.includes(i)?'✓':i===9?'🏆':'★'}</button><div class="path-label">${i+1}. ${esc(l.title)}</div></div>`).join('')}</div><div class="notice">This first release teaches general automatic-vehicle basics. State-specific permit preparation and road-test courses are planned, not yet verified or included.</div>`}
function lesson(){const l=LESSONS[lessonIndex],intro=step<l.info.length,question=l.q[questionIndex];const teacher=l.teacher===data.buddy?CHARACTERS.find(c=>c!==data.buddy):l.teacher;return `<div style="padding-top:18px"><button class="btn neutral" data-action="exitLesson">← Exit lesson</button><p class="eyebrow">UNIT 1 · LESSON ${lessonIndex+1} · ${intro?'LEARN':'PRACTICE'}</p><div class="progress"><div style="width:${Math.min(100,(intro?(step+1)/(l.info.length+l.q.length):(l.info.length+questionIndex+1)/(l.info.length+l.q.length))*100)}%"></div></div><h1>${esc(l.title)}</h1>${intro?`${bubble(teacher,l.info[step])}<div class="card lesson-info">${l.info[step]}</div>${button(step===l.info.length-1?'START PRACTICE →':'CONTINUE →','nextInfo','wide')}`:`${bubble(teacher,'Let’s try a question! 📝')}<h2 class="question">${esc(question[0])}</h2><div class="stack">${question[1].map((a,i)=>`<button class="choice ${selected===i?'selected':''}" data-answer="${i}" ${answered?'disabled':''}>${esc(a)}</button>`).join('')}</div>${answered?`<div class="feedback ${selected===question[2]?'':'bad'}"><strong>${selected===question[2]?'Correct! 🎉':'Not quite — let’s learn it! 💡'}</strong><p>${esc(question[3])}</p></div>`:''}<div style="margin-top:16px">${answered?button(selected===question[2]?'CONTINUE →':'TRY AGAIN ↻',selected===question[2]?'nextQuestion':'retry','wide'):button('CHECK ANSWER','check','wide')}${button('💡 ASK MY BUDDY','hint','secondary wide')}</div><div id="hint" style="margin-top:12px"></div>`}</div>`}
function review(){return `<section class="hero"><h1>Review 📚</h1><p>Practice completed lessons as often as you like.</p></section>${data.completed.length?`<div class="stack">${data.completed.map(i=>`<button class="choice" data-lesson="${i}">✓ ${esc(LESSONS[i].title)} — Practice again</button>`).join('')}</div>`:'<div class="card">Finish your first lesson to unlock review.</div>'}<div class="card"><h2>Official resources</h2><p>For Pennsylvania, study the official <a href="https://www.pa.gov/agencies/dmv/driver-services/pennsylvania-drivers-manual/online-drivers-manual" target="_blank" rel="noopener">PennDOT Driver’s Manual</a>. For other states, use your state DMV’s current official manual.</p></div>`}
function awards(){return `<section class="hero"><h1>Your achievements 🏆</h1><p>Celebrate every step forward.</p></section><div class="card"><h2>⭐ ${data.xp} XP</h2><p>🔥 ${data.streak} day study streak</p><p>📗 ${data.completed.length} lessons completed</p></div><div class="card"><h2>Badges</h2>${data.awards.length?data.awards.map(a=>`<p>🏅 ${esc(a)}</p>`).join(''):'<p>Complete your first lesson to earn a badge!</p>'}</div>`}
function profile(){return `<section class="hero"><h1>My Driverz Profile</h1><p>Your driving journey is just getting started.</p></section><div class="card">${bubble(data.buddy,'I’m your Driving School Buddy! 🚗')}<p><b>State:</b> ${esc(data.state)}</p><p><b>Completed:</b> ${data.completed.length} / ${LESSONS.length} foundational lessons</p><p><b>XP:</b> ${data.xp}</p>${button('SETTINGS','settings','secondary wide')}</div>`}
function settings(){return `<h1>Settings ⚙</h1><div class="card"><h2>State</h2><select id="stateSelect">${STATES.map(s=>`<option ${data.state===s?'selected':''}>${s}</option>`).join('')}</select><p class="muted">Changing state does not reset foundational lessons. State-specific courses are not yet implemented.</p></div><div class="card"><h2>Driving School Buddy</h2><div class="grid">${CHARACTERS.map(c=>`<button class="choice avatar ${data.buddy===c?'selected':''}" data-buddy="${c}">${img(c)}<span>${esc(c)}</span></button>`).join('')}</div></div><div class="card"><h2>Theme</h2>${themeChoices()}</div><div class="card"><h2>Sound effects</h2><button class="btn secondary wide" data-action="sound">${data.sound?'🔊 ON — Tap to mute':'🔇 OFF — Tap to enable'}</button></div><div class="card"><h2>Progress backup</h2><p class="muted">Progress is saved on this device in this browser. Clearing site data may erase it.</p>${button('EXPORT MY PROGRESS','export','secondary wide')}<p><label class="btn neutral wide" for="importFile">IMPORT PROGRESS FILE</label><input id="importFile" type="file" accept="application/json,.json" class="hidden"></p></div>${button('← BACK TO SCHOOL','learn','neutral wide')}`}
function finish(){const was=data.completed.includes(lessonIndex);if(!was){data.completed.push(lessonIndex);data.completed.sort((a,b)=>a-b);data.xp+=lessonIndex===9?30:20;const today=new Date().toLocaleDateString('en-CA');if(data.lastStudy!==today){const yesterday=new Date();yesterday.setDate(yesterday.getDate()-1);data.streak=data.lastStudy===yesterday.toLocaleDateString('en-CA')?data.streak+1:1;data.lastStudy=today;play('streak')}if(data.completed.length===1&&!data.awards.includes('First Steps')){data.awards.push('First Steps');play('achievement')}if(lessonIndex===9&&!data.awards.includes('Car Controls Graduate')){data.awards.push('Car Controls Graduate');play('levelup')}else play('complete');if(data.unlocked===lessonIndex&&lessonIndex<LESSONS.length-1){data.unlocked++;setTimeout(()=>play('unlock'),350)}}else play('complete');save();screen='learn';render();window.scrollTo(0,0)}
function openLesson(i){if(i>data.unlocked)return;lessonIndex=i;step=0;questionIndex=0;selected=-1;answered=false;mistakes=0;screen='lesson';play('click');render();window.scrollTo(0,0)}
function hint(){const l=LESSONS[lessonIndex],q=l.q[questionIndex];const hints=[`Think back to the explanation. ${q[3]} 🤔`,`Try eliminating answers that don't match what you learned. 💚`,`The answer is: <strong>${esc(q[1][q[2]])}</strong>. You can do it! ⭐`];const el=document.getElementById('hint');let n=Number(el.dataset.level||0);el.innerHTML=bubble(data.buddy,hints[Math.min(n,2)]);el.dataset.level=String(Math.min(n+1,2));play('click')}
function doAction(a){if(a!=='check')play('click');switch(a){case'onboard':screen='onboard';break;case'finishSetup':data.setup=true;save();screen='learn';break;case'nextInfo':step++;if(step>=LESSONS[lessonIndex].info.length){step=LESSONS[lessonIndex].info.length;questionIndex=0}break;case'check':if(selected<0)return;answered=true;if(selected===LESSONS[lessonIndex].q[questionIndex][2])play('correct');else{mistakes++;play('incorrect')}break;case'retry':selected=-1;answered=false;break;case'nextQuestion':if(questionIndex+1>=LESSONS[lessonIndex].q.length){finish();return}questionIndex++;selected=-1;answered=false;break;case'exitLesson':screen='learn';break;case'hint':hint();return;case'sound':data.sound=!data.sound;save();break;case'export':{const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const link=document.createElement('a');link.href=url;link.download='driverz-progress.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);return}default:if(['learn','review','awards','profile','settings'].includes(a))screen=a}render()}
app.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.action){doAction(b.dataset.action);return}if(b.dataset.lesson!==undefined){openLesson(Number(b.dataset.lesson));return}if(b.dataset.buddy){data.buddy=b.dataset.buddy;save();play('click');render();return}if(b.dataset.theme){data.theme=b.dataset.theme;save();play('click');render();return}if(b.dataset.answer!==undefined&&!answered){selected=Number(b.dataset.answer);play('click');render()}});
app.addEventListener('change',async e=>{if(e.target.id==='stateSelect'){data.state=e.target.value;save();render()}if(e.target.id==='importFile'){const file=e.target.files?.[0];if(!file)return;try{const x=JSON.parse(await file.text());if(!x||typeof x!=='object'||!STATES.includes(x.state)||!CHARACTERS.includes(x.buddy)||!Object.hasOwn(THEMES,x.theme)||!Array.isArray(x.completed)||!x.completed.every(i=>Number.isInteger(i)&&i>=0&&i<LESSONS.length))throw Error('Invalid backup');data={...defaults,...x,setup:true,unlocked:Math.max(0,Math.min(LESSONS.length-1,Number(x.unlocked)||0)),completed:[...new Set(x.completed)],xp:Math.max(0,Number(x.xp)||0),streak:Math.max(0,Number(x.streak)||0),awards:Array.isArray(x.awards)?x.awards.filter(a=>typeof a==='string').slice(0,50):[]};save();screen='profile';render();alert('Progress imported!')}catch(err){alert('This is not a valid Driverz progress backup.')}}});
document.getElementById('settingsBtn').addEventListener('click',()=>{screen='settings';play('click');render()});document.getElementById('nav').addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(b){screen=b.dataset.tab;play('click');render();window.scrollTo(0,0)}});render();
</script></body></html>
